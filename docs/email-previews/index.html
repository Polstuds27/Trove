<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trove email designs</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 20px; background: #F7F0E5; color: #294737; font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 1260px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.7px; }
    header p { margin: 0; color: #68736B; line-height: 1.6; }
    .designs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; margin-top: 26px; }
    article { min-width: 0; }
    .label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 16px; }
    a { color: #294737; font-size: 13px; font-weight: bold; text-underline-offset: 3px; }
    iframe { display: block; width: 100%; height: 890px; border: 1px solid #D9D3C9; border-radius: 16px; background: #F7F0E5; }
  </style>
</head>
<body>
  <main>
    <header><h1>Trove email designs</h1><p>Verification, password recovery, and secure sign-in. These previews use sample names, links, and codes.</p></header>
    <section class="designs" aria-label="Email previews">
      <article><div class="label"><h2>Email verification</h2><a href="verify.html" target="_blank">Open HTML</a></div><iframe src="verify.html" title="Email verification design"></iframe></article>
      <article><div class="label"><h2>Password reset</h2><a href="password_reset.html" target="_blank">Open HTML</a></div><iframe src="password_reset.html" title="Password reset design"></iframe></article>
      <article><div class="label"><h2>Sign-in code</h2><a href="mfa_code.html" target="_blank">Open HTML</a></div><iframe src="mfa_code.html" title="Sign-in code design"></iframe></article>
    </section>
  </main>
</body>
</html>
